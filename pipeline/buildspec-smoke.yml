version: 0.2

# ---------------------------------------------------------------------------
# Smoke test: invoke the freshly deployed dev function for real.
#
# The dev stack is deployed with DRY_RUN=true and SchedulesEnabled=false, so this
# exercises the entire path - real HTTP to FPL, real DynamoDB writes, real S3
# archival, real rendering - and stops short only of sending the email.
#
# This catches the class of failure unit tests structurally cannot: a missing IAM
# permission, a wrong environment variable, a layer that imports fine locally and
# not on arm64, a handler path typo. Every one of those passes every test and
# fails on first invocation.
# ---------------------------------------------------------------------------

phases:
  install:
    runtime-versions:
      python: 3.13

  build:
    commands:
      # CloudFormation reports the change set complete before Lambda has
      # finished applying the new code, so an invoke fired immediately after
      # can hit ResourceConflictException - "The operation cannot be performed
      # at this time. An update is in progress". Nothing is wrong; the deploy
      # simply has not settled.
      #
      # Not hypothetical: this failed the GW1 2026-27 deploy at 16:36 with a
      # live deadline 54 minutes away, and retrying the stage worked first
      # time. The wait is the fix; the retry below covers the remainder.
      - echo "Waiting for ${FUNCTION_NAME} to finish updating"
      - aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
      - |
        # The previous version ended in `|| { echo "Invocation call failed";
        # exit 1; }`, which discarded the AWS error and left only a
        # FileNotFoundError on response.json in the next phase. Diagnosing GW1
        # took far longer than it should have, so stderr is now printed.
        attempt=1
        max_attempts=3
        while true; do
          echo "Invoking ${FUNCTION_NAME} in dry-run mode (attempt ${attempt}/${max_attempts})"
          if aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --cli-binary-format raw-in-base64-out \
              --payload '{}' \
              --log-type Tail \
              --query 'LogResult' \
              --output text \
              response.json > log.b64 2> invoke.err; then
            break
          fi
          echo "--- invoke failed on attempt ${attempt} ---"
          cat invoke.err || true
          if [ "${attempt}" -ge "${max_attempts}" ]; then
            echo "FAIL: could not invoke ${FUNCTION_NAME} after ${max_attempts} attempts"
            exit 1
          fi
          attempt=$((attempt + 1))
          sleep 15
        done
      - echo "--- Function logs ---"
      - base64 -d log.b64 || true
      - echo "--- Response ---"
      - cat response.json

  post_build:
    commands:
      # A 200 with a recognised status is the pass condition. Note that
      # `snapshot_only` and `no_deadline` are both SUCCESSES: outside a
      # notification window, or in the off-season, doing nothing is the correct
      # behaviour and the smoke test must not treat it as a failure.
      - |
        python - <<'PY'
        import json, sys

        with open("response.json") as handle:
            payload = json.load(handle)

        print("Parsed response:", json.dumps(payload, indent=2))

        if payload.get("errorMessage"):
            print("FAIL: the function raised:", payload["errorMessage"])
            sys.exit(1)

        status = (payload.get("body") or {}).get("status")
        acceptable = {"snapshot_only", "sent", "suppressed", "no_deadline"}

        if status not in acceptable:
            print(f"FAIL: unexpected status {status!r}; expected one of {sorted(acceptable)}")
            sys.exit(1)

        print(f"PASS: function returned status {status!r}")
        PY
